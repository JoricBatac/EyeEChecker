# Local development: Postgres, MinIO (local S3 stand-in) and the backend.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: scanassist
      POSTGRES_PASSWORD: scanassist
      POSTGRES_DB: scanassist
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scanassist"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb -p local/scanassist-photos;
      mc ilm rule add --expire-days 7 local/scanassist-photos || true;
      "

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      postgres: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://scanassist:scanassist@postgres:5432/scanassist
      STORAGE_BACKEND: s3
      STORAGE_BUCKET: scanassist-photos
      STORAGE_REGION: asia-southeast1
      STORAGE_ENDPOINT_URL: http://minio:9000
      STORAGE_PUBLIC_ENDPOINT_URL: http://localhost:9000
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin
      PACKS_DIR: /srv/packs
      MODEL_DIR: /srv/models
      CLASSIFIER: ${CLASSIFIER:-stub}
      HF_TOKEN: ${HF_TOKEN:-}
      JWT_SECRET: dev-only-secret
      PATIENT_HASH_SALT: dev-only-salt
    ports: ["8000:8000"]
    volumes:
      - ./packs:/srv/packs:ro
      - ./models:/srv/models
      - hfcache:/root/.cache/huggingface

volumes:
  pgdata:
  miniodata:
  hfcache:
